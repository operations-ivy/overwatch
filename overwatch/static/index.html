<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overwatch — overwatch.brick.nozdormu.cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* Palette, type and HUD chrome shared with wigle-console and chucks-wisdom's reader. */
:root{
  --bg:#07050f;
  --panel:#0e0a1e;
  --panel-2:#120d24;
  --line:#241a44;
  --line-bright:#3a2a6e;
  --text:#e7e3ff;
  --text-dim:#a39dd0;
  --text-faint:#6f68a0;
  --magenta:#ff2a6d;
  --cyan:#05d9e8;
  --amber:#f9c80e;
  --violet:#9d4edd;
  --acid:#39ff88;
  --danger:#ff3860;
  --font-display:'Orbitron',"Segoe UI",sans-serif;
  --font-ui:'Rajdhani',"Segoe UI",sans-serif;
  --font-mono:'Share Tech Mono','Courier New',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{font-size:17px;}
@media (min-width:900px){ html{font-size:18px;} }
body{ background:var(--bg); color:var(--text); font-family:var(--font-ui); min-height:100vh; }
::selection{background:var(--magenta);color:#07050f;}

.scanlines{
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 2px, transparent 3px);
  mix-blend-mode:overlay;
}
.wrap{ position:relative; z-index:3; max-width:1440px; margin:0 auto; padding:20px 16px 48px; display:flex; flex-direction:column; gap:18px; }
/* Desktop: the feeds on the left, alerts on the right. Phones: one column. */
.cols{ display:grid; grid-template-columns:minmax(0,1fr); gap:18px; align-items:start; }
@media (min-width:1000px){ .cols{ grid-template-columns:minmax(0,5fr) minmax(0,3fr); } }
.stack{ display:grid; gap:18px; min-width:0; }

/* ---- The header: brand, the feeds' status, the headline, the tiles ---- */
.hud{
  border:1px solid var(--line-bright); background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border-radius:8px; padding:20px 22px 22px; position:relative; overflow:hidden;
  box-shadow:0 0 0 1px rgba(5,217,232,0.08), 0 18px 60px -30px rgba(255,42,109,0.35);
}
.hud::before, .panel::before{
  content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--magenta), var(--cyan), var(--violet), var(--magenta));
  background-size:200% 100%; animation:sweep 6s linear infinite;
}
@keyframes sweep{ to{ background-position:200% 0; } }
/* A fresh alert flashes the whole header for a minute. */
.hud.siren{ animation:siren 1s steps(1) infinite; border-color:var(--danger); }
@keyframes siren{ 0%{ background:#ff3860; } 50%{ background:#6e1028; } }
.hud.siren .word, .hud.siren .line, .hud.siren .chip, .hud.siren .chip b{ color:#fff !important; text-shadow:none; }
.hud-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.brand-title{
  font-family:var(--font-display); font-weight:900; font-size:clamp(28px,6vw,40px); letter-spacing:.03em; margin:0; line-height:1;
  text-shadow:0 0 18px rgba(255,42,109,0.55), 0 0 42px rgba(5,217,232,0.25);
}
.clock{ font-family:var(--font-mono); font-size:1rem; color:var(--text-dim); }

/* One chip per feed, plus the page's own link. */
.strip{ margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid var(--line-bright); border-radius:999px;
  font-family:var(--font-mono); font-size:.85rem; color:var(--text-dim); background:rgba(255,255,255,0.02);
}
.chip .dot{ width:9px; height:9px; border-radius:50%; background:var(--text-faint); flex:none; }
.chip.ok .dot{ background:var(--acid); box-shadow:0 0 8px var(--acid); }
.chip.starting .dot{ background:var(--amber); box-shadow:0 0 8px var(--amber); }
.chip.error .dot{ background:var(--danger); box-shadow:0 0 8px var(--danger); }
.chip.error{ border-color:rgba(255,56,96,.5); }
.chip b{ font-weight:400; color:var(--text); }

/* The headline: the state in one word, then one sentence. */
.word{
  margin-top:18px; font-family:var(--font-display); font-weight:700; font-size:clamp(38px,9vw,60px); line-height:1;
  color:var(--text-faint);
}
.word.ok{ color:var(--acid); text-shadow:0 0 22px rgba(57,255,136,.5); }
.word.idle{ color:var(--amber); text-shadow:0 0 22px rgba(249,200,14,.5); }
.word.bad{ color:var(--danger); text-shadow:0 0 22px rgba(255,56,96,.6); }
.line{ margin-top:10px; font-family:var(--font-mono); font-size:1.05rem; color:var(--text-dim); overflow-wrap:anywhere; }

.tiles{ margin-top:18px; display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; }
.tile{ border:1px solid var(--line); background:rgba(255,255,255,0.02); border-radius:6px; padding:12px 14px; min-width:0; }
.tile .n{
  font-family:var(--font-display); font-size:1.75rem; font-weight:700; color:var(--text); line-height:1.1;
  font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tile .l{ font-family:var(--font-mono); font-size:.72rem; letter-spacing:.14em; color:var(--text-faint); text-transform:uppercase; margin-top:4px; }
.tile .sub{ font-family:var(--font-mono); font-size:.78rem; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile.cyan .n{ color:var(--cyan); text-shadow:0 0 12px rgba(5,217,232,.6); }
.tile.magenta .n{ color:var(--magenta); text-shadow:0 0 12px rgba(255,42,109,.6); }
.tile.ok .n{ color:var(--acid); text-shadow:0 0 12px rgba(57,255,136,.5); }
.tile.idle .n{ color:var(--amber); text-shadow:0 0 12px rgba(249,200,14,.5); }
.tile.bad{ border-color:var(--danger); }
.tile.bad .n{ color:var(--danger); text-shadow:0 0 12px rgba(255,56,96,.6); }
.tile.dim .n{ color:var(--text-faint); text-shadow:none; }

/* ---- One panel per feed, all the same shape ---- */
.panel{
  position:relative; overflow:hidden; border:1px solid var(--line); border-radius:8px; padding:18px 20px 16px;
  background:linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%); min-width:0;
}
.panel::before{ opacity:.35; }
.panel.alerted{ border-color:rgba(255,56,96,.55); }
.panel-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; flex-wrap:wrap; }
.panel-head .pico{ width:28px; height:28px; color:var(--cyan); filter:drop-shadow(0 0 6px rgba(5,217,232,.45)); flex:none; }
.panel-head h2{ font-family:var(--font-display); font-size:1.15rem; font-weight:700; letter-spacing:.06em; color:var(--text); margin:0; text-transform:uppercase; }
.panel-head .chip{ margin-left:auto; }
.panel-meta{ font-family:var(--font-mono); font-size:.82rem; color:var(--text-faint); margin:0 0 12px 40px; }
@media (max-width:599px){ .panel-meta{ margin-left:0; } }

table{ width:100%; border-collapse:collapse; }
th{
  text-align:left; font-weight:400; font-family:var(--font-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-faint); padding:6px 12px 6px 0; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{ padding:12px 12px 12px 0; border-bottom:1px dashed var(--line); vertical-align:middle; }
td.what .name{ font-family:var(--font-ui); font-weight:700; font-size:1.3rem; color:var(--text); line-height:1.15; }
td.what .sub{ font-family:var(--font-mono); font-size:.82rem; color:var(--text-dim); margin-top:3px; }
th.num, td.num{ text-align:right; }
td.num{ font-family:var(--font-ui); font-weight:700; font-size:1.55rem; font-variant-numeric:tabular-nums; color:var(--text); white-space:nowrap; }
td.num.dim{ font-size:1.25rem; color:var(--text-dim); }
td.num.idle{ color:var(--amber); }
td.num.bad{ color:var(--danger); }
td.v{ text-align:right; padding-right:0; }
tr.hot td.what .name{ color:#fff; }

/* A row with details opens to show them. */
.toggle{
  display:flex; align-items:center; gap:12px; width:100%; padding:0; margin:0; background:none; border:0;
  color:inherit; font:inherit; text-align:left; cursor:pointer;
}
.toggle:disabled{ cursor:default; }
.toggle:focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; border-radius:3px; }
.chev{ flex:none; width:12px; color:var(--text-faint); font-family:var(--font-mono); font-size:.9rem; transition:transform .15s; }
.toggle:disabled .chev{ visibility:hidden; }
.toggle[aria-expanded="true"] .chev{ transform:rotate(90deg); color:var(--cyan); }
.ico{ flex:none; width:28px; height:28px; color:var(--cyan); filter:drop-shadow(0 0 6px rgba(5,217,232,.45)); }
.ico.magenta{ color:var(--magenta); filter:drop-shadow(0 0 6px rgba(255,42,109,.45)); }
.ico.bad{ color:var(--danger); filter:drop-shadow(0 0 6px rgba(255,56,96,.45)); }
.ico.idle{ color:var(--amber); filter:drop-shadow(0 0 6px rgba(249,200,14,.4)); }
.ico.dim{ opacity:.55; }
tr.open > td{ border-bottom:0; }
tr.detail > td{ padding:0 0 16px 52px; border-bottom:1px dashed var(--line); }
.cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; }
.card{ border:1px solid var(--line); border-radius:6px; background:rgba(255,255,255,0.02); padding:10px 12px; min-width:0; }
.card .head{ display:flex; align-items:baseline; gap:8px; }
.card .head b{ font-family:var(--font-ui); font-weight:700; font-size:1.05rem; color:var(--text); }
.card .head span{ margin-left:auto; font-family:var(--font-mono); font-size:.78rem; color:var(--text-faint); white-space:nowrap; }
.meter{ height:5px; margin:8px 0 6px; background:var(--line); border-radius:3px; overflow:hidden; }
.meter i{ display:block; height:100%; background:linear-gradient(90deg, var(--cyan), var(--acid)); }
.card dl{ display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:4px 0 0; font-family:var(--font-mono); font-size:.82rem; }
.card dt{ color:var(--text-faint); }
.card dd{ margin:0; color:var(--text-dim); overflow-wrap:anywhere; }
/* Phones: the verdict moves under the name, so the name keeps its width. */
.what .verdict{ display:none; margin-top:6px; }
@media (max-width:599px){
  th.vh, td.v{ display:none; }
  .what .verdict{ display:inline-block; }
  tr.detail > td{ padding-left:0; }
}

.verdict{
  display:inline-block; font-family:var(--font-mono); font-size:.74rem; letter-spacing:.12em; text-transform:uppercase;
  padding:3px 8px; border-radius:3px; border:1px solid currentColor; white-space:nowrap;
}
.verdict.ok{ color:var(--acid); }
.verdict.bad{ color:var(--danger); }
.verdict.idle{ color:var(--amber); }
.verdict.unsure{ color:var(--violet); }
.verdict.dim{ color:var(--text-faint); }

.alert{ border-left:3px solid var(--danger); padding:10px 12px; margin-bottom:8px; background:rgba(255,56,96,0.06); border-radius:0 4px 4px 0; }
.alert .top{ display:flex; gap:4px 10px; align-items:baseline; flex-wrap:wrap; }
.alert .name{ font-family:var(--font-ui); font-weight:700; font-size:1.15rem; color:var(--text); }
.alert .from{ font-family:var(--font-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); }
.alert .when{ margin-left:auto; font-family:var(--font-mono); font-size:.8rem; color:var(--text-faint); white-space:nowrap; }
.alert .detail{ font-family:var(--font-mono); font-size:.85rem; color:var(--text-dim); margin-top:3px; }

.empty{ font-family:var(--font-mono); font-size:.9rem; color:var(--text-faint); padding:12px 0 4px; }
footer{ font-family:var(--font-mono); font-size:.78rem; color:var(--text-faint); text-align:center; }

@media (prefers-reduced-motion: reduce){ .hud::before, .panel::before{ animation:none; } .hud.siren{ animation:none; background:#6e1028; } }
</style>

<div class="scanlines" aria-hidden="true"></div>

<div class="wrap">

  <header class="hud" id="hud">
    <div class="hud-top">
      <h1 class="brand-title">overwatch</h1>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div class="strip" id="strip"></div>
    <div class="word" id="word" aria-live="polite">WAITING</div>
    <div class="line" id="line">Waiting for the feeds…</div>
    <div class="tiles" id="tiles"></div>

  <div class="cols">
    <div class="stack" id="feeds"></div>
    <section class="panel">
      <div class="panel-head"><h2>Alerts</h2><span class="chip"><b>last 30 min</b></span></div>
      <div id="alerts"></div>
      <div class="empty" id="alerts-empty">None.</div>
    </section>
  </div>

  <footer>Bluetooth and Wi-Fi addresses are never stored or shown · operations-ivy/overwatch</footer>
</div>

const SVGNS = "http://www.w3.org/2000/svg";
function svg(key, cls) {
  const [vb, body] = SHAPES[key] || SHAPES.activity;  // an unknown feed's icon still draws
  const e = document.createElementNS(SVGNS, "svg");
  e.setAttribute("viewBox", vb); e.setAttribute("aria-hidden", "true"); e.setAttribute("class", cls);
  e.innerHTML = body;  // our own constants above, never data from the feed
  return e;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Times arrive as timestamps, so they keep moving between pushes.
function duration(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s < 60) return `${s} s`;
  if (s < 3600) return `${Math.floor(s / 60)} min ${s % 60} s`;
  return `${Math.floor(s / 3600)} h ${Math.floor(s / 60) % 60} min`;
}
function ago(seconds) { return seconds < 1 ? "just now" : seconds < 60 ? `${seconds.toFixed(1)} s ago` : `${duration(seconds)} ago`; }
function minsAgo(seconds) { const m = Math.round(seconds / 60); return m < 1 ? "just now" : `${m} min ago`; }
function text(v, now) {
  if (v === null || v === undefined) return "";
  if (!Array.isArray(v)) return String(v);
  return v.map(s => typeof s === "string" ? s : "ago" in s ? ago(now - s.ago) : "for" in s ? duration(now - s.for)
                  : "mins" in s ? minsAgo(now - s.mins) : "").join("");
}

// Which rows are open, kept across updates (and reloads, where storage allows).
let open = new Set();
try { open = new Set(JSON.parse(localStorage.getItem("overwatch.open2") || "[]")); } catch (e) {}
function toggle(key) {
  open.has(key) ? open.delete(key) : open.add(key);
  try { localStorage.setItem("overwatch.open2", JSON.stringify([...open])); } catch (e) {}
  if (last) render(last);
}

function chip(state, label, value) {
  const c = el("span", `chip ${state}`);
  c.append(el("span", "dot"), document.createTextNode(label ? `${label} ` : ""), el("b", "", value));
  return c;
}

function card(c, now) {
  const box = el("div", "card"), head = el("div", "head");
  head.append(el("b", "", c.title || ""), el("span", "", text(c.right, now)));
  box.append(head);
  if (typeof c.meter === "number") {
    const m = el("div", "meter"), bar = el("i");
    bar.style.width = `${Math.max(0, Math.min(100, c.meter))}%`; m.append(bar); box.append(m);
  }
  const dl = el("dl");
  for (const [k, v] of c.fields || []) dl.append(el("dt", "", k), el("dd", "", text(v, now)));
  box.append(dl);
  return box;
}

function panelView(feed, p, now, err) {
  const sec = el("section", "panel");
  if (p.rows.some(r => r.hot)) sec.classList.add("alerted");
  const head = el("div", "panel-head");
  const st = err ? { state: "error", text: err } : p.status || { state: "starting", text: "…" };
  head.append(svg(p.icon, "pico"), el("h2", "", p.title || feed.name), chip(st.state, "", st.text));
  sec.append(head);
  if (p.meta) sec.append(el("div", "panel-meta", text(p.meta, now)));
  const cols = p.columns || [{ label: "What" }];
  if (p.rows.length) {
    const table = el("table"), thead = el("thead"), hr = el("tr"), body = el("tbody");
    cols.forEach(c => hr.append(el("th", c.num ? "num" : "", c.label)));
    hr.append(el("th", "vh"));
    thead.append(hr); table.append(thead, body);
    for (const r of p.rows) {
      const key = `${feed.name}:${r.key}`, details = r.details || [], isOpen = details.length > 0 && open.has(key);
      const tr = el("tr", `${r.hot ? "hot" : ""}${isOpen ? " open" : ""}`), what = el("td", "what");
      const btn = el("button", "toggle"), words = el("div");
      btn.type = "button"; btn.disabled = details.length === 0;
      btn.setAttribute("aria-expanded", String(isOpen));
      btn.addEventListener("click", () => toggle(key));
      words.append(el("div", "name", text(r.name, now)));
      if (r.sub) words.append(el("div", "sub", text(r.sub, now)));
      if (r.verdict) words.append(el("span", `verdict ${r.verdict.tone || ""}`, r.verdict.text));
      btn.append(el("span", "chev", "▸"), svg(r.icon || p.icon, `ico ${r.tone || ""}${r.dim ? " dim" : ""}`), words);
      what.append(btn); tr.append(what);
      (r.cells || []).forEach(c => tr.append(el("td", `num ${c.tone || ""}`, text(c.text, now))));
      const v = el("td", "v");
      if (r.verdict) v.append(el("span", `verdict ${r.verdict.tone || ""}`, r.verdict.text));
      tr.append(v); body.append(tr);
      if (isOpen) {
        const d = el("tr", "detail"), cell = el("td"), grid = el("div", "cards");
        cell.colSpan = cols.length + 1;
        grid.append(...details.map(c => card(c, now)));
        cell.append(grid); d.append(cell); body.append(d);
      }
    }
    sec.append(table);
  } else {
    sec.append(el("div", "empty", err ? `${err}.` : text(p.empty, now) || "Nothing here."));
  }
  return sec;
}

// Pushed, not polled: each feed sends its changes to the web pods, which send
// them straight on here (Server-Sent Events; the browser reconnects itself).
let last = null, seenAlerts = null, sirenUntil = 0, linkState = ["starting", "connecting"];

function render(st) {
  const now = Date.now() / 1000, feeds = st.feeds || [];
  const required = feeds[0], live = feeds.filter(f => f.state && f.state.panel);
  const panels = live.map(f => ({ feed: f, p: f.state.panel }));
  const alerts = panels.flatMap(({ feed, p }) => (p.alerts || []).map(a => ({ ...a, from: p.title || feed.name })))
                       .sort((a, b) => b.at - a.at);

  // The strip: every feed's state, then the page's own link to the pods.
  const strip = feeds.map(f => {
    const p = f.state && f.state.panel;
    const s = f.error ? { state: "error", text: f.error } : p ? p.status : { state: "starting", text: "…" };
    return chip(s.state, (p && p.title) || f.name, s.text);
  });
  const changed = st.changed ? now - st.changed : null;
  strip.push(chip(linkState[0], "feed", linkState[1]),
             chip(changed === null ? "starting" : "ok", "last change", changed === null ? "—" : changed < 60 ? `${changed.toFixed(1)} s ago` : minsAgo(changed)));
  $("strip").replaceChildren(...strip);

  // The headline: one word and one sentence, the most severe across feeds.
  let word, tone, line;
  const fresh = alerts.find(a => now - a.at < 300);
  const worst = panels.filter(({ p }) => p.headline).sort((a, b) => b.p.headline.severity - a.p.headline.severity)[0];
  if (!required || !required.state) [word, tone, line] = ["WAITING", "", `Waiting for the ${required ? required.name : "feeds"}…`];
  else if (required.error) [word, tone, line] = ["NO SIGNAL", "bad", `Lost the ${required.name}; reconnecting. Showing what it last said.`];
  else if (fresh) [word, tone, line] = ["ALERT", "bad", `${fresh.label}: ${fresh.detail ? fresh.detail : `${fresh.count} around, usually ${fresh.normal}`} (${minsAgo(now - fresh.at)}).`];
  else if (worst && worst.p.headline.severity > 0) [word, tone, line] = [worst.p.headline.word, worst.p.headline.tone, text(worst.p.headline.line, now)];
  else {
    const h = required.state.panel && required.state.panel.headline;
    [word, tone, line] = ["ALL CLEAR", "ok", h ? text(h.line, now) : ""];
  }
  $("word").textContent = word; $("word").className = `word ${tone || ""}`;
  $("line").textContent = line;
  document.title = `${word.toLowerCase()} · overwatch`;

  // The tiles: alerts, then every feed's own.
  const tile = (t) => { const b = el("div", `tile ${t.tone || ""}`); b.append(el("div", "n", t.value), el("div", "l", t.label), el("div", "sub", t.sub || " ")); return b; };
  $("tiles").replaceChildren(
    tile({ label: "Alerts", value: required && required.state ? String(alerts.length) : "—", sub: "last 30 min", tone: alerts.length ? "bad" : "ok" }),
    ...panels.flatMap(({ p }) => (p.stats || []).map(tile)));

  // One panel per feed, in the order the pods were given them.
  $("feeds").replaceChildren(...feeds.map(f => {
    const p = f.state && f.state.panel;
    if (p) return panelView(f, p, now, f.error);
    const sec = el("section", "panel"), head = el("div", "panel-head");
    head.append(svg("activity", "pico"), el("h2", "", f.name), chip(f.error ? "error" : "starting", "", f.error || "waiting"));
    sec.append(head, el("div", "empty", f.error ? `${f.error}.` : `Waiting for the ${f.name}…`));
    return sec;
  }));

  $("alerts").replaceChildren(...alerts.map(a => {
    const box = el("div", "alert"), top = el("div", "top");
    top.append(el("span", "name", a.label), el("span", "from", a.from), el("span", "when", minsAgo(now - a.at)));
    box.append(top, el("div", "detail", a.detail ? `${a.detail} · ${a.confidence} confidence`
                                               : `${a.count} around, usually ${a.normal} · ${a.confidence} confidence`));
    return box;
  }));
  $("alerts-empty").hidden = alerts.length > 0;

  // A new alert (not one already there when the page opened) flashes the header for a minute.
  const keys = alerts.map(a => `${a.from}|${a.kind}|${a.at}`);
  if (seenAlerts && keys.some(k => !seenAlerts.has(k))) sirenUntil = Date.now() + 60000;
  if (required && required.state) seenAlerts = new Set(keys);
  $("hud").classList.toggle("siren", Date.now() < sirenUntil);
}

function tick() { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
setInterval(() => { if (last) render(last); }, 1000);
setInterval(tick, 1000); tick();

function connect() {
  const feed = new EventSource("/api/stream");
  feed.onopen = () => { linkState = ["ok", "live"]; if (last) render(last); };
  feed.onmessage = e => { last = JSON.parse(e.data); render(last); };
  feed.onerror = () => { linkState = ["error", "reconnecting"]; if (last) render(last); };  // EventSource retries on its own
}
connect();
</script>
